{% extends "base.html" %}

{% block title %}Login - PocketSmart AI{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 border-0 shadow-sm rounded-4">
            <div class="text-center mb-4">
                <div class="icon-box bg-primary-subtle text-primary mx-auto mb-3">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h3 class="fw-bold">Welcome Back</h3>
                <p class="text-muted small">Access your saved budget plans and personalized dashboard.</p>
            </div>

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show rounded-3 small py-2" role="alert">
                <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form method="POST" action="/login">
                <input type="hidden" name="next" value="{{ next or '/dashboard' }}">
                
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Username or Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                        <input type="text" name="username_or_email" class="form-control border-start-0" placeholder="Enter username or email" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold shadow-sm mb-3">
                    Sign In <i class="fa-solid fa-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="text-center small text-muted border-top pt-3">
                Don't have an account? <a href="/register" class="fw-semibold text-primary">Register here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

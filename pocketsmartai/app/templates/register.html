{% extends "base.html" %}

{% block title %}Create Account - PocketSmart AI{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 border-0 shadow-sm rounded-4">
            <div class="text-center mb-4">
                <div class="icon-box bg-success-subtle text-success mx-auto mb-3">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h3 class="fw-bold">Create Account</h3>
                <p class="text-muted small">Join PocketSmart AI to organize budgets and get tailored recommendations.</p>
            </div>

            {% if error %}
            <div class="alert alert-danger alert-dismissible fade show rounded-3 small py-2" role="alert">
                <i class="fa-solid fa-circle-exclamation me-1"></i> {{ error }}
                <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
            </div>
            {% endif %}

            <form method="POST" action="/register">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-id-card text-muted"></i></span>
                        <input type="text" name="full_name" class="form-control border-start-0" placeholder="e.g. Rohid Khan">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-at text-muted"></i></span>
                        <input type="text" name="username" class="form-control border-start-0" placeholder="e.g. rohid_khan" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input type="email" name="email" class="form-control border-start-0" placeholder="name@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted">Password (min 6 characters)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-key text-muted"></i></span>
                        <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 rounded-pill fw-semibold shadow-sm mb-3">
                    Register Account <i class="fa-solid fa-check ms-1"></i>
                </button>
            </form>

            <div class="text-center small text-muted border-top pt-3">
                Already registered? <a href="/login" class="fw-semibold text-primary">Login here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
